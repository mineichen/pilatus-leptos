[workspace]
resolver = "3"
members = [
    "app-backend",
    "pilatus-leptos",
    "pilatus-leptos-app",
    "pilatus-engineering-leptos",
    "pilatus-examples-leptos",
    "pilatus-emulation-camera-leptos"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
egui = "0.33"
egui-pixels = { git = "https://github.com/mineichen/egui-pixels" }
#egui-pixels = { path = "../egui-pixels/egui-pixels" }
eframe = "0.33"
futures = "0.3"
gloo-events = "0.2"
gloo-net = "0.6"
gloo-timers = "0.3"
gloo-utils = "0.2"
image = { version = "0.25", default-features = false }
imbuf = { git = "https://github.com/mineichen/image-buffer.git", branch = "vtable_per_channel" }
impex = { git = "https://github.com/mineichen/impex", features = ["visitor"] }
js-sys = "0.3"
leptos = "0.8"
leptos_axum = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_forge_utils_leptos = "0.6"
minfac = "0.1"
pilatus = { git = "https://github.com/mineichen/pilatus.git", default-features = false }
pilatus-axum = { git = "https://github.com/mineichen/pilatus.git" }
pilatus-leptos = { path = "pilatus-leptos" }
pilatus-examples-leptos = { path = "pilatus-examples-leptos"}
pilatus-emulation-camera = { git = "https://github.com/mineichen/pilatus.git" }
pilatus-emulation-camera-rt = { git = "https://github.com/mineichen/pilatus.git" }
pilatus-engineering-rt = { git = "https://github.com/mineichen/pilatus.git" }
pilatus-tick = { git = "https://github.com/mineichen/pilatus.git" }
reactive_graph = "0.2"
reactive_stores = "0.3"
serde = "1"
serde_json = "1"
thaw = { git = "https://github.com/thaw-ui/thaw.git" }
thaw_utils = { git = "https://github.com/thaw-ui/thaw.git" }
thiserror = "2"
web-sys = "0.3"


# Optimize pilatus-engineering-leptos even in debug mode for better performance
[profile.dev.package.pilatus-engineering-leptos]
opt-level = 2

[profile.dev.package.egui-pixels]
opt-level = 2

