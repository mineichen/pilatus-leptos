[package]
name = "pilatus-engineering-leptos"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
gloo-events.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
imanot.workspace = true
imask = { workspace = true, features = ["async-io"] }
imbuf.workspace = true
js-sys.workspace = true
leptos.workspace = true
pilatus.workspace = true
pilatus-engineering.workspace = true
pilatus-leptos.workspace = true
pin-project-lite = "0.2"
thiserror.workspace = true
thaw.workspace = true
wasm-bindgen = "0.2"
web-sys = { workspace = true, features = ["File", "FileList", "HtmlElement", "DragEvent", "DataTransfer", "Document", "VisibilityState"] }

# Important to enable native build for winit
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "x11"] }


[dev-dependencies]
any_spawner = { version = "0.3", features = ["tokio"] }
reactive_graph = { workspace = true, features = ["effects"] }
tokio = { version = "1", features = ["rt", "macros"] }
